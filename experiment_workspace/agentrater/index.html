<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentRater · AI 智能体点评平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">🤖</span>
        <span class="logo-text">AgentRater</span>
      </a>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索 AI 智能体…" autocomplete="off" aria-label="搜索智能体">
        <button class="search-clear" id="searchClear" aria-label="清空搜索" style="display:none;">✕</button>
      </div>
      <div class="nav-actions">
        <button class="fav-btn" id="favFilterBtn" aria-label="仅看收藏">
          <span class="fav-icon">❤️</span>
          <span class="fav-label">收藏</span>
          <span class="fav-badge" id="favBadge">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 横幅 Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">发现最好的 AI 智能体</h1>
      <p class="hero-subtitle">浏览 · 搜索 · 评价 · 收藏 —— 像找餐厅一样找到最适合你的 AI Agent</p>
    </div>
  </section>

  <!-- 分类筛选栏 -->
  <section class="filter-bar">
    <div class="filter-inner">
      <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab active" data-category="全部">全部</button>
        <button class="cat-tab" data-category="编程助手">编程助手</button>
        <button class="cat-tab" data-category="客服机器人">客服机器人</button>
        <button class="cat-tab" data-category="数据分析">数据分析</button>
        <button class="cat-tab" data-category="创意设计">创意设计</button>
        <button class="cat-tab" data-category="办公效率">办公效率</button>
      </div>
      <div class="sort-group" id="sortGroup">
        <button class="sort-btn active" data-sort="default">默认</button>
        <button class="sort-btn" data-sort="rating">综合评分↓</button>
        <button class="sort-btn" data-sort="reviewCount">评价数↓</button>
      </div>
    </div>
  </section>

  <!-- Agent 卡片网格 -->
  <main class="main-content">
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <span class="empty-icon">🔍</span>
      <p>未找到匹配的 Agent，试试其他关键词？</p>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="logo-icon">🤖</span>
        <span>AgentRater</span>
      </div>
      <p class="footer-copy">© 2025 AgentRater · AI 智能体点评平台 — 让每一个 Agent 都被看见</p>
      <div class="footer-links">
        <a href="#">关于我们</a>
        <a href="#">使用条款</a>
        <a href="#">隐私政策</a>
        <a href="#">联系客服</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
