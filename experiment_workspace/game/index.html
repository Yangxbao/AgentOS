<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;color:#FFFF00}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
#hud{display:flex;justify-content:space-between;width:600px;font-size:18px;font-weight:bold}
#hud span{min-width:140px}
#score{text-align:left}
#hi{text-align:right}
canvas{border:2px solid #333;display:block;background:#000}
#info{font-size:14px;color:#aaa;text-align:center;margin-top:6px;line-height:1.6}
#overlay{position:absolute;top:0;left:0;width:600px;height:600px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.75);z-index:10}
#overlay h2{font-size:36px;margin-bottom:12px;color:#FFFF00}
#overlay p{font-size:18px;margin-bottom:8px;color:#ccc}
#overlay .final{font-size:24px;color:#FF0000;margin:8px 0}
#btn{margin-top:14px;padding:10px 28px;font-size:18px;font-family:inherit;background:#00FF00;color:#000;border:none;cursor:pointer;font-weight:bold}
#btn:hover{background:#00CC00}
#canvasWrap{position:relative;display:inline-block}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="score">得分: 0</span>
    <span id="hi">最高分: 0</span>
  </div>
  <div id="canvasWrap">
    <canvas id="c" width="600" height="600"></canvas>
    <div id="overlay">
      <h2>贪吃蛇</h2>
      <p>方向键 / WASD 控制方向</p>
      <p>空格键 暂停 / 继续</p>
      <button id="btn">开始游戏</button>
    </div>
  </div>
  <div id="info">方向键/WASD 移动 | 空格 暂停 | 吃食物 +10 分</div>
</div>
<script>
(function(){
  /* ---- 常量 ---- */
  var COLS=20,ROWS=20,CELL=30,W=600,H=600;
  var DIR={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
  var OPP={UP:'DOWN',DOWN:'UP',LEFT:'RIGHT',RIGHT:'LEFT'};
  var SPEED=130; // ms 每步

  /* ---- DOM ---- */
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');
  var scoreEl=document.getElementById('score');
  var hiEl=document.getElementById('hi');
  var overlay=document.getElementById('overlay');
  var btn=document.getElementById('btn');

  /* ---- 状态 ---- */
  var snake,dir,nextDir,food,score,hiScore,running,paused,dead,timer;

  /* ---- localStorage ---- */
  function loadHi(){try{return parseInt(localStorage.getItem('snake_hi'))||0}catch(e){return 0}}
  function saveHi(v){try{localStorage.setItem('snake_hi',v)}catch(e){}}

  /* ---- 初始化 ---- */
  function init(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir='RIGHT';nextDir='RIGHT';
    score=0;hiScore=loadHi();
    running=false;paused=false;dead=false;
    scoreEl.textContent='得分: 0';
    hiEl.textContent='最高分: '+hiScore;
    placeFood();
    draw();
  }

  /* ---- 放置食物 ---- */
  function placeFood(){
    var free=[];
    for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++){
      var occ=false;
      for(var i=0;i<snake.length;i++)if(snake[i].x===x&&snake[i].y===y){occ=true;break}
      if(!occ)free.push({x:x,y:y});
    }
    if(free.length===0){dead=true;endGame();return}
    food=free[Math.floor(Math.random()*free.length)];
  }

  /* ---- 绘制 ---- */
  function draw(){
    // 背景
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);
    // 网格线
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.lineWidth=1;
    for(var i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke()}
    for(var j=0;j<=ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(W,j*CELL);ctx.stroke()}
    // 食物
    if(food){
      ctx.fillStyle='#FF0000';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,10,0,Math.PI*2);
      ctx.fill();
    }
    // 蛇身
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i];
      if(i===0){
        // 蛇头
        ctx.fillStyle='#00FF00';
        ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
        // 眼睛
        ctx.fillStyle='#000';
        var cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
        var d=DIR[dir];
        var ex1,ey1,ex2,ey2;
        if(d.x===1){ex1=cx+6;ey1=cy-5;ex2=cx+6;ey2=cy+5}
        else if(d.x===-1){ex1=cx-6;ey1=cy-5;ex2=cx-6;ey2=cy+5}
        else if(d.y===-1){ex1=cx-5;ey1=cy-6;ex2=cx+5;ey2=cy-6}
        else{ex1=cx-5;ey1=cy+6;ex2=cx+5;ey2=cy+6}
        ctx.beginPath();ctx.arc(ex1,ey1,2.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(ex2,ey2,2.5,0,Math.PI*2);ctx.fill();
      }else{
        ctx.fillStyle='#00CC00';
        ctx.fillRect(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4);
      }
    }
  }

  /* ---- 游戏步进 ---- */
  function step(){
    if(paused||dead)return;
    dir=nextDir;
    var head={x:snake[0].x+DIR[dir].x,y:snake[0].y+DIR[dir].y};
    // 撞墙
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){dead=true;endGame();return}
    // 撞自己
    for(var i=0;i<snake.length;i++)if(snake[i].x===head.x&&snake[i].y===head.y){dead=true;endGame();return}
    snake.unshift(head);
    // 吃食物
    if(food&&head.x===food.x&&head.y===food.y){
      score+=10;
      scoreEl.textContent='得分: '+score;
      if(score>hiScore){hiScore=score;hiEl.textContent='最高分: '+hiScore;saveHi(hiScore)}
      placeFood();
    }else{
      snake.pop();
    }
    draw();
  }

  /* ---- 结束 ---- */
  function endGame(){
    running=false;
    clearInterval(timer);
    draw();
    overlay.innerHTML='<h2>游戏结束</h2><p class="final">得分: '+score+'</p><p>最高分: '+hiScore+'</p><button id="btn" onclick="window._restart()">重新开始</button>';
    overlay.style.display='flex';
  }

  /* ---- 开始 ---- */
  function startGame(){
    clearInterval(timer);
    init();
    overlay.style.display='none';
    running=true;paused=false;
    timer=setInterval(step,SPEED);
  }

  /* ---- 暂停切换 ---- */
  function togglePause(){
    if(!running||dead)return;
    paused=!paused;
    if(paused){
      overlay.innerHTML='<h2>已暂停</h2><p>按空格键继续</p>';
      overlay.style.display='flex';
    }else{
      overlay.style.display='none';
    }
  }

  /* ---- 键盘 ---- */
  document.addEventListener('keydown',function(e){
    var k=e.key;
    // 方向 — 守卫检查 nextDir 而非 dir，防止同帧双按键绕过反向保护
    if(k==='ArrowUp'||k==='w'||k==='W'){if(nextDir!=='DOWN')nextDir='UP';e.preventDefault()}
    else if(k==='ArrowDown'||k==='s'||k==='S'){if(nextDir!=='UP')nextDir='DOWN';e.preventDefault()}
    else if(k==='ArrowLeft'||k==='a'||k==='A'){if(nextDir!=='RIGHT')nextDir='LEFT';e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){if(nextDir!=='LEFT')nextDir='RIGHT';e.preventDefault()}
    // 空格
    else if(k===' '){
      e.preventDefault();
      if(!running&&!dead){startGame();return}
      togglePause();
    }
  });

  /* ---- 按钮 ---- */
  btn.addEventListener('click',function(){startGame()});
  window._restart=function(){startGame()};

  /* ---- 启动 ---- */
  init();
})();
</script>
</body>
</html>
